# Free, every-minute heartbeat for The Launch Feed's scheduler.
# Cloudflare Workers free plan: cron triggers included, 100k requests/day
# (this uses ~1,440/day).
#
#   cd workers/scheduler-heartbeat
#   npx wrangler login
#   npx wrangler secret put CRON_SECRET      # same value as on Vercel
#   npx wrangler deploy
name = "launchfeed-scheduler-heartbeat"
main = "index.js"
compatibility_date = "2026-09-01"
workers_dev = false

[triggers]
crons = ["* * * * *"]

[vars]
TARGET_URL = "https://thelaunchfeed.com/api/cron"
